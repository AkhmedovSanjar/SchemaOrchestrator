name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build-and-sqlite-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore SchemaOrchestrator.slnx
      - name: Build
        run: dotnet build SchemaOrchestrator.slnx -c Release --no-restore
      - name: Run SQLite and unit tests
        run: dotnet test SchemaOrchestrator.slnx -c Release --no-build --filter "Category!=SqlServer&Category!=PostgreSql"

  sqlserver-integration:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          SA_PASSWORD: YourStrong!Passw0rd
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P YourStrong!Passw0rd -Q 'SELECT 1' -C || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=30
    env:
      SO_TEST_SQLSERVER_CONN: Server=localhost,1433;Database=master;User Id=sa;Password=YourStrong!Passw0rd;Encrypt=False;TrustServerCertificate=True
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore SchemaOrchestrator.slnx
      - name: Build
        run: dotnet build SchemaOrchestrator.slnx -c Release --no-restore
      - name: Run SQL Server integration tests
        run: dotnet test SchemaOrchestrator.slnx -c Release --no-build --filter "Category=SqlServer"

  postgresql-integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres-version: [ "15", "16" ]
    services:
      postgres:
        image: postgres:${{ matrix.postgres-version }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    env:
      SO_TEST_POSTGRES_CONN: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore SchemaOrchestrator.slnx
      - name: Build
        run: dotnet build SchemaOrchestrator.slnx -c Release --no-restore
      - name: Run PostgreSQL integration tests
        run: dotnet test SchemaOrchestrator.slnx -c Release --no-build --filter "Category=PostgreSql"

  provider-package-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dotnet-version: [ "9.0.x", "10.0.x" ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet-version }}
      - name: Restore
        run: dotnet restore SchemaOrchestrator.slnx
      - name: Build
        run: dotnet build SchemaOrchestrator.slnx -c Release --no-restore
      - name: Test (non-provider-gated)
        run: dotnet test SchemaOrchestrator.slnx -c Release --no-build --filter "Category!=SqlServer&Category!=PostgreSql"
